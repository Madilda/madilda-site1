<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Madilda — That's a movie? Yeah, it's a book too.">
  <title>Madilda</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main>
    <section class="hero">
      <div class="copy">
        <p class="eyebrow">ON SOLANA</p>
        <h1>THAT'S A<br>MOVIE?</h1>
        <h2>YEAH, IT'S A<br>BOOK TOO.</h2>
        <div class="buttons">
          <a class="button primary" href="https://raydium.io/launchpad/token/?mint=6N1BFBPB8T6JcsB3krc4fCynkBu9VZYfmLWFXwrcJray" target="_blank" rel="noopener noreferrer">Buy on Raydium</a>
          <a class="button" href="https://x.com/MadildaCoin" target="_blank" rel="noopener noreferrer">X</a>
          <a class="button" href="https://t.me/MadildaPortal" target="_blank" rel="noopener noreferrer">Telegram</a>
        </div>
        <div class="contract">
          <p class="contract-label">OFFICIAL CONTRACT</p>
          <div class="contract-card">
            <div class="contract-text">
              <span class="contract-network">SOLANA</span>
              <code id="contract-address">6N1BFBPB8T6JcsB3krc4fCynkBu9VZYfmLWFXwrcJray</code>
            </div>
            <button type="button" class="copy-button" onclick="copyContract()" aria-label="Copy official Madilda contract address">
              <span class="copy-icon" aria-hidden="true">⧉</span>
              <span id="copy-button-text">Copy address</span>
            </button>
          </div>
          <p id="copy-status" class="copy-status" aria-live="polite"></p>
        </div>
      </div>
      <div class="visual">
        <div class="halo" aria-hidden="true"></div>
        <img class="hero-logo" src="logo.png" alt="Madilda gold character">
      </div>
    </section>
  </main>
  <script>
    async function copyContract() {
      const contract = "6N1BFBPB8T6JcsB3krc4fCynkBu9VZYfmLWFXwrcJray";
      const status = document.getElementById("copy-status");
      const buttonText = document.getElementById("copy-button-text");
      try {
        await navigator.clipboard.writeText(contract);
        buttonText.textContent = "Copied";
        status.textContent = "Official contract copied to clipboard.";
        window.setTimeout(() => {
          buttonText.textContent = "Copy address";
          status.textContent = "";
        }, 1800);
      } catch (error) {
        status.textContent = "Could not copy automatically. Tap and hold the address instead.";
      }
    }
  </script>
</body>
</html>
