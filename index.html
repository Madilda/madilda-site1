<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Madilda — That's a movie? Yeah, it's a book too.">
  <title>Madilda</title>
  <link rel="icon" href="logo.png">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;800&display=swap');

    :root {
      --bg: #090806;
      --text: #fff8e8;
      --gold: #f4c542;
      --gold-dark: #c48f12;
      --line: rgba(244,197,66,.34);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: #090806;
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.75'/%3E%3C/svg%3E");
    }

    main {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 0 48px;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: 48px;
    }

    .copy {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--gold);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .20em;
    }

    h1, h2 {
      margin: 0;
      font-family: "Archivo Black", Arial, sans-serif;
      line-height: .92;
      letter-spacing: -.02em;
    }

    h1 { font-size: clamp(68px, 8vw, 124px); }

    h2 {
      margin-top: 20px;
      color: var(--gold);
      font-size: clamp(48px, 6vw, 88px);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      min-width: 118px;
      padding: 14px 20px;
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      text-transform: uppercase;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .03em;
      transition: .2s ease;
    }

    .button.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #171006;
    }

    .button:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: #171006;
      transform: translateY(-2px);
    }

    .contract {
      margin-top: 28px;
      width: min(100%, 720px);
    }

    .contract-label {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    .contract-card {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: stretch;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(244,197,66,.10), rgba(255,255,255,.02));
      box-shadow: 0 18px 55px rgba(0,0,0,.28);
      overflow: hidden;
    }

    .contract-copy {
      min-width: 0;
      padding: 16px 18px;
    }

    .network {
      display: block;
      margin-bottom: 7px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    .address {
      display: block;
      color: var(--text);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .copy-button {
      min-width: 170px;
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--gold);
      color: #171006;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: .2s ease;
    }

    .copy-button:hover { filter: brightness(1.08); }
    .copy-button:active { transform: scale(.98); }

    .copy-status {
      min-height: 18px;
      margin: 8px 0 0;
      color: var(--gold);
      font-size: 12px;
    }

    .visual {
      min-height: 620px;
      display: grid;
      place-items: center;
      position: relative;
    }

    .halo {
      width: 520px;
      height: 520px;
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244,197,66,.30), transparent 68%);
      filter: blur(18px);
    }

    .hero-logo {
      width: min(100%, 520px);
      position: relative;
      z-index: 1;
      mix-blend-mode: screen;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }

    @media (max-width: 850px) {
      main { padding: 0 24px; }

      .hero {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 60px 0 40px;
      }

      .visual {
        min-height: 350px;
        order: -1;
      }

      .hero-logo { width: min(86vw, 390px); }
      .halo { width: 340px; height: 340px; }

      h1 { font-size: clamp(54px, 16vw, 82px); }
      h2 { font-size: clamp(38px, 11vw, 62px); }
    }

    @media (max-width: 650px) {
      .contract-card {
        grid-template-columns: 1fr;
      }

      .copy-button {
        min-height: 52px;
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero">
      <div class="copy">
        <p class="eyebrow">ON SOLANA</p>

        <h1>THAT'S A<br>MOVIE?</h1>
        <h2>YEAH, IT'S A<br>BOOK TOO.</h2>

        <div class="buttons">
          <a
            class="button primary"
            href="https://raydium.io/launchpad/token/?mint=6N1BFBPB8T6JcsB3krc4fCynkBu9VZYfmLWFXwrcJray"
            target="_blank"
            rel="noopener noreferrer"
          >Buy on Raydium</a>

          <a
            class="button"
            href="https://x.com/MadildaCoin"
            target="_blank"
            rel="noopener noreferrer"
          >X</a>

          <a
            class="button"
            href="https://t.me/MadildaPortal"
            target="_blank"
            rel="noopener noreferrer"
          >Telegram</a>
        </div>

        <div class="contract">
          <p class="contract-label">OFFICIAL CONTRACT</p>

          <div class="contract-card">
            <div class="contract-copy">
              <span class="network">SOLANA</span>
              <code class="address">6N1BFBPB8T6JcsB3krc4fCynkBu9VZYfmLWFXwrcJray</code>
            </div>

            <button class="copy-button" type="button" onclick="copyContract()">
              <span id="copy-button-text">⧉ Copy address</span>
            </button>
          </div>

          <p class="copy-status" id="copy-status" aria-live="polite"></p>
        </div>
      </div>

      <div class="visual">
        <div class="halo"></div>
        <img class="hero-logo" src="logo.png" alt="Madilda gold character">
      </div>
    </section>
  </main>

  <script>
    async function copyContract() {
      const contract = "6N1BFBPB8T6JcsB3krc4fCynkBu9VZYfmLWFXwrcJray";
      const buttonText = document.getElementById("copy-button-text");
      const status = document.getElementById("copy-status");

      try {
        await navigator.clipboard.writeText(contract);
        buttonText.textContent = "✓ Copied";
        status.textContent = "Official contract copied.";

        setTimeout(() => {
          buttonText.textContent = "⧉ Copy address";
          status.textContent = "";
        }, 1800);
      } catch {
        status.textContent = "Tap and hold the address to copy it.";
      }
    }
  </script>
</body>
</html>
